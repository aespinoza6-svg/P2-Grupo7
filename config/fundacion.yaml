# Geometría y material de la fundación (caso base del curso: Ju y Lei, 2019).
#
# Cada valor indica su ORIGEN:
#   [ENUNCIADO]   dato dado por el curso (00_PROYECTO_GENERAL.md, sección 4)
#   [PROVISIONAL] supuesto nuestro, porque el artículo no lo define de forma
#                 inequívoca. Se reemplaza cuando el profesor entregue/valide
#                 la geometría oficial. Ver docs/05_decisiones_y_supuestos.md.
#
# Simplificaciones geométricas (documentadas, no silenciosas):
#   - la losa es un prisma recto de base cuadrada (sin taludes ni chaflanes);
#   - el pedestal es un cilindro recto centrado sobre la losa;
#   - no se modelan pernos de anclaje, armaduras ni ductos.

geometria:
  losa_largo_x_m: 18.0        # [ENUNCIADO] "aproximadamente 18 m x 18 m"
  losa_ancho_y_m: 18.0        # [ENUNCIADO]
  pedestal_diametro_m: 7.0    # [ENUNCIADO] "parte superior cilíndrica de ~7 m de diámetro"
  altura_total_m: 3.30        # [ENUNCIADO] "espesor 3,30 m" -> [PROVISIONAL] lo interpretamos como altura total losa + pedestal
  altura_pedestal_m: 1.00     # [PROVISIONAL] el artículo no lo define

# Propiedades térmicas del hormigón.
# [PROVISIONAL] Valores típicos de hormigón (los mismos del código de ejemplo
# del curso). Se calibrarán en la semana 3 con Ju y Lei (2019) e ICH.
hormigon:
  nombre: Hormigon G30
  conductividad_W_mK: 2.0     # k
  densidad_kg_m3: 2400.0      # rho
  calor_especifico_J_kgK: 900.0   # cp
